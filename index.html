<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 가위바위보 손 모양 인식기</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Google Fonts: 둥근 모서리 느낌의 폰트 -->
    <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Jua', sans-serif;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-indigo-50 via-purple-50 to-pink-50 min-h-screen flex flex-col items-center justify-between p-4">

    <!-- 상단 타이틀 -->
    <header class="w-full max-w-md text-center py-4">
        <h1 class="text-3xl text-indigo-700 drop-shadow-sm">✨ AI 가위바위보 인식기 ✨</h1>
        <p class="text-sm text-gray-500 mt-1">웹캠에 가위, 바위, 보를 보여주세요!</p>
    </header>

    <!-- 중앙 웹캠 및 결과 표시 영역 -->
    <main class="w-full max-w-md flex flex-col items-center relative flex-1 justify-center my-2">
        <div class="relative w-full aspect-[3/4] bg-white rounded-3xl shadow-xl overflow-hidden border-4 border-indigo-100 flex items-center justify-center">
            <!-- 웹캠 비디오 -->
            <video id="webcam" autoplay playsinline muted class="w-full h-full object-cover transform -scale-x-100"></video>
            <!-- 캡처용 숨겨진 캔버스 -->
            <canvas id="canvas" class="hidden"></canvas>

            <!-- 오른쪽 상단 인식 결과 오버레이 -->
            <div id="result-badge" class="absolute top-4 right-4 bg-white/90 backdrop-blur-md px-4 py-3 rounded-2xl shadow-lg border border-indigo-50 flex flex-col items-center transition-all duration-300">
                <span id="result-icon" class="text-4xl">⏳</span>
                <span id="result-text" class="text-xs text-gray-500 mt-1">대기 중</span>
                <span id="result-conf" class="text-xs font-bold text-indigo-600">0%</span>
            </div>

            <!-- 카메라 꺼짐 상태 안내 -->
            <div id="camera-off-msg" class="absolute inset-0 flex flex-col items-center justify-center bg-indigo-50/80 text-indigo-400">
                <svg class="w-16 h-16 mb-2 animate-bounce" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path>
                </svg>
                <span class="text-lg">카메라를 시작해주세요</span>
            </div>
        </div>
    </main>

    <!-- 하단 컨트롤 버튼 영역 -->
    <footer class="w-full max-w-md py-4 flex flex-col gap-3">
        <div class="grid grid-cols-2 gap-3">
            <button id="cam-toggle-btn" onclick="toggleCamera()" class="py-3 px-4 bg-indigo-500 hover:bg-indigo-600 text-white font-medium rounded-2xl shadow-md transition active:scale-95 flex items-center justify-center gap-2">
                📷 카메라 켜기
            </button>
            <button id="detect-toggle-btn" onclick="toggleDetection()" disabled class="py-3 px-4 bg-gray-200 text-gray-400 font-medium rounded-2xl shadow-sm transition active:scale-95 flex items-center justify-center gap-2 cursor-not-allowed">
                ▶️ 인식 시작
            </button>
        </div>
    </footer>

    <!-- 자바스크립트 로직 -->
    <script>
        const video = document.getElementById('webcam');
        const canvas = document.getElementById('canvas');
        const cameraOffMsg = document.getElementById('camera-off-msg');
        const camToggleBtn = document.getElementById('cam-toggle-btn');
        const detectToggleBtn = document.getElementById('detect-toggle-btn');
        
        const resultIcon = document.getElementById('result-icon');
        const resultText = document.getElementById('result-text');
        const resultConf = document.getElementById('result-conf');

        let mediaStream = null;
        let isCameraOn = false;
        let isDetecting = false;
        let detectInterval = null;
        let isProcessing = false; // 중복 API 요청 방지용 플래그

        // 이모지 및 한글 매핑
        const classMap = {
            'rock': { text: '바위', icon: '✊' },
            'paper': { text: '보', icon: '🖐' },
            'scissors': { text: '가위', icon: '✌' }
        };

        // 카메라 켜기 /끄기 토글
        async function toggleCamera() {
            if (!isCameraOn) {
                try {
                    mediaStream = await navigator.mediaDevices.getUserMedia({ 
                        video: { width: { ideal: 640 }, height: { ideal: 480 }, facingMode: 'user' } 
                    });
                    video.srcObject = mediaStream;
                    isCameraOn = true;
                    cameraOffMsg.classList.add('hidden');
                    camToggleBtn.innerHTML = '🛑 카메라 끄기';
                    camToggleBtn.className = 'py-3 px-4 bg-rose-500 hover:bg-rose-600 text-white font-medium rounded-2xl shadow-md transition active:scale-95 flex items-center justify-center gap-2';
                    
                    // 인식 버튼 활성화
                    detectToggleBtn.disabled = false;
                    detectToggleBtn.className = 'py-3 px-4 bg-emerald-500 hover:bg-emerald-600 text-white font-medium rounded-2xl shadow-md transition active:scale-95 flex items-center justify-center gap-2 cursor-pointer';
                } catch (err) {
                    alert('웹캠 권한이 거부되었거나 카메라를 사용할 수 없습니다.');
                    console.error(err);
                }
            } else {
                stopDetection();
                if (mediaStream) {
                    mediaStream.getTracks().forEach(track => track.stop());
                }
                video.srcObject = null;
                isCameraOn = false;
                cameraOffMsg.classList.remove('hidden');
                camToggleBtn.innerHTML = '📷 카메라 켜기';
                camToggleBtn.className = 'py-3 px-4 bg-indigo-500 hover:bg-indigo-600 text-white font-medium rounded-2xl shadow-md transition active:scale-95 flex items-center justify-center gap-2';
                
                // 인식 버튼 비활성화
                detectToggleBtn.disabled = true;
                detectToggleBtn.className = 'py-3 px-4 bg-gray-200 text-gray-400 font-medium rounded-2xl shadow-sm transition active:scale-95 flex items-center justify-center gap-2 cursor-not-allowed';
                
                resetResultUI();
            }
        }

        // 인식 시작 / 중지 토글
        function toggleDetection() {
            if (!isCameraOn) return;

            if (!isDetecting) {
                isDetecting = true;
                detectToggleBtn.innerHTML = '⏸️ 인식 중지';
                detectToggleBtn.className = 'py-3 px-4 bg-amber-500 hover:bg-amber-600 text-white font-medium rounded-2xl shadow-md transition active:scale-95 flex items-center justify-center gap-2';
                
                // 약 1초(1000ms) 간격으로 예측 요청 실행
                detectInterval = setInterval(sendFrameForPrediction, 1000);
            } else {
                stopDetection();
            }
        }

        function stopDetection() {
            isDetecting = false;
            if (detectInterval) clearInterval(detectInterval);
            detectInterval = null;
            if (isCameraOn) {
                detectToggleBtn.innerHTML = '▶️ 인식 시작';
                detectToggleBtn.className = 'py-3 px-4 bg-emerald-500 hover:bg-emerald-600 text-white font-medium rounded-2xl shadow-md transition active:scale-95 flex items-center justify-center gap-2';
            }
            resetResultUI();
        }

        function resetResultUI() {
            resultIcon.innerText = '⏳';
            resultText.innerText = '대기 중';
            resultConf.innerText = '0%';
        }

        // 현재 웹캠 프레임을 캡처하여 서버리스 API로 전송
        async function sendFrameForPrediction() {
            if (!isDetecting || isProcessing || !isCameraOn) return;
            isProcessing = true;

            try {
                // 캔버스에 현재 비디오 프레임 그리기
                canvas.width = video.videoWidth || 640;
                canvas.height = video.videoHeight || 480;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

                // Base64 형식으로 변환 (헤더 제거)
                const base64Data = canvas.toDataURL('image/jpeg', 0.8).split(',')[1];

                // 백엔드 API 호출 (/api/predict)
                const response = await fetch('/api/predict', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ image: base64Data })
                });

                if (!response.ok) throw new Error('API 요청 실패');

                const data = await response.json();
                updateResultUI(data);

            } catch (err) {
                console.error('인식 오류:', err);
            } finally {
                isProcessing = false;
            }
        }

        // 예측 결과 화면 반영
        function updateResultUI(data) {
            // Roboflow 모델 응답 구조에 맞게 수정 가능 (classification 또는 object detection 결과 처리)
            // 일반적인 Classification Workflow 응답 구조 가정: { predictions: { class: 'rock', confidence: 0.95 } } 또는 유사 구조
            let className = '';
            let confidence = 0;

            if (data) {
                // Workflow 응답 포맷에 따라 파싱 (예: data.predictions 또는 data.output 등)
                // Roboflow Workflow 표준 응답 구조 대응
                const prediction = data.predictions || data.output || data;
                className = prediction.class || prediction.predicted_classes || (Array.isArray(prediction) ? prediction[0]?.class : '');
                confidence = prediction.confidence || (Array.isArray(prediction) ? prediction[0]?.confidence : 0);
            }

            if (className && classMap[className]) {
                const info = classMap[className];
                resultIcon.innerText = info.icon;
                resultText.innerText = info.text;
                resultConf.innerText = `${Math.round(confidence * 100)}%`;
            } else {
                resultIcon.innerText = '❓';
                resultText.innerText = '인식 불가';
                resultConf.innerText = '0%';
            }
        }
    </script>
</body>
</html>
