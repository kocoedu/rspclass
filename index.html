<!DOCTYPE html>
<html lang="ko" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 가위바위보 실시간 인식</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="h-full bg-slate-50 text-slate-800 flex flex-col items-center justify-between p-4 md:p-6">

    <header class="w-full max-w-4xl text-center py-2">
        <h1 class="text-2xl md:text-3xl font-extrabold tracking-tight text-slate-900">
            AI 가위바위보 실시간 인식
        </h1>
        <p class="text-xs md:text-sm text-slate-500 mt-1">Roboflow 모델을 활용한 손 모양 감지 웹앱 (rock, paper, scissors)</p>
    </header>

    <main class="w-full max-w-4xl flex-1 flex flex-col md:flex-row gap-4 items-center justify-center my-auto">
        <div class="relative w-full aspect-video md:aspect-[4/3] bg-slate-200 rounded-3xl overflow-hidden shadow-xl border border-slate-200 flex items-center justify-center">
            <video id="webcam" autoplay playsinline muted class="w-full h-full object-cover"></video>
            
            <!-- Result Display Badge (Top Right) -->
            <div class="absolute top-4 right-4 z-10 bg-white/90 backdrop-blur-md border border-slate-200 px-4 py-2.5 rounded-2xl shadow-md flex items-center gap-3">
                <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider">인식 결과:</span>
                <span id="result-badge" class="text-lg md:text-xl font-bold text-emerald-600 capitalize">대기 중...</span>
            </div>

            <!-- Debug / Status Log Badge (Bottom Left) -->
            <div id="debug-badge" class="absolute bottom-4 left-4 z-10 bg-slate-900/75 backdrop-blur-md text-white px-3 py-1.5 rounded-xl text-xs font-mono hidden">
                디버그: <span id="debug-text">준비 완료</span>
            </div>

            <!-- Hidden Canvas for frame capturing -->
            <canvas id="snapshot-canvas" class="hidden"></canvas>
            
            <!-- Loading/Error overlay -->
            <div id="status-overlay" class="absolute inset-0 bg-white/95 flex flex-col items-center justify-center p-6 text-center transition-opacity duration-300">
                <div class="w-10 h-10 border-4 border-emerald-500 border-t-transparent rounded-full animate-spin mb-3"></div>
                <p id="status-text" class="text-sm font-medium text-slate-600">웹캠 연결 및 모델 초기화 중...</p>
            </div>
        </div>
    </main>

    <footer class="w-full max-w-4xl flex flex-col sm:flex-row items-center justify-between gap-3 bg-white border border-slate-200 p-4 rounded-2xl shadow-sm">
        <div class="flex items-center gap-2 text-xs text-slate-500">
            <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></span>
            <span>서버리스 API 프록시 연동 완료 (Vercel 배포 최적화)</span>
        </div>
        <div class="flex gap-2 w-full sm:w-auto">
            <button id="toggle-btn" class="flex-1 sm:flex-none px-5 py-2.5 bg-emerald-600 hover:bg-emerald-500 font-semibold text-sm text-white rounded-xl shadow-md transition-all duration-200 active:scale-95 disabled:opacity-50">
                인식 시작
            </button>
        </div>
    </footer>

    <script>
        const video = document.getElementById('webcam');
        const canvas = document.getElementById('snapshot-canvas');
        const ctx = canvas.getContext('2d');
        const resultBadge = document.getElementById('result-badge');
        const statusOverlay = document.getElementById('status-overlay');
        const statusText = document.getElementById('status-text');
        const toggleBtn = document.getElementById('toggle-btn');
        const debugBadge = document.getElementById('debug-badge');
        const debugText = document.getElementById('debug-text');

        let isRunning = false;
        let inferenceInterval = null;

        // Initialize WebCam stream
        async function initCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { width: { ideal: 640 }, height: { ideal: 480 }, facingMode: 'user' }
                });
                video.srcObject = stream;
                await new Promise((resolve) => {
                    video.onloadedmetadata = () => {
                        resolve();
                    };
                });
                statusOverlay.style.opacity = '0';
                setTimeout(() => statusOverlay.classList.add('hidden'), 300);
            } catch (err) {
                console.error('Webcam error:', err);
                statusText.innerText = '웹캠 권한이 거부되었거나 장치를 찾을 수 없습니다.';
                document.querySelector('.animate-spin').style.display = 'none';
            }
        }

        // Capture frame and send to serverless API (/api/generate)
        async function runInference() {
            if (!isRunning) return;

            try {
                canvas.width = video.videoWidth || 640;
                canvas.height = video.videoHeight || 480;
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                
                // Get base64 string without data URI prefix
                const dataUrl = canvas.toDataURL('image/jpeg', 0.75);
                const base64Image = dataUrl.split(',')[1];

                const response = await fetch('/api/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ image: base64Image })
                });

                if (!response.ok) {
                    const errJson = await response.json().catch(() => ({}));
                    throw new Error(errJson.error || `HTTP error! status: ${response.status}`);
                }

                const data = await response.json();
                
                // Support multiple Roboflow response structures (predictions array or top prediction)
                let predictions = [];
                if (Array.isArray(data.predictions)) {
                    predictions = data.predictions;
                } else if (data.predictions && typeof data.predictions === 'object') {
                    // Sometimes object map or single prediction
                    predictions = Object.values(data.predictions);
                }

                if (predictions.length > 0) {
                    const topPrediction = predictions.reduce((prev, current) => (prev.confidence > current.confidence) ? prev : current);
                    
                    // Lower confidence threshold slightly to 30% for easier debugging, you can adjust as needed
                    if (topPrediction.confidence > 0.3) {
                        const className = (topPrediction.class || '').toLowerCase();
                        let displayKo = className;
                        if (className === 'rock') displayKo = '바위 (Rock)';
                        else if (className === 'paper') displayKo = '보 (Paper)';
                        else if (className === 'scissors') displayKo = '가위 (Scissors)';

                        resultBadge.innerText = displayKo;
                        resultBadge.className = "text-lg md:text-xl font-bold capitalize text-emerald-600";
                        
                        debugBadge.classList.remove('hidden');
                        debugText.innerText = `${topPrediction.class} (${Math.round(topPrediction.confidence * 100)}%)`;
                    } else {
                        resultBadge.innerText = '인식 중...';
                        resultBadge.className = "text-lg md:text-xl font-bold text-slate-400";
                    }
                } else {
                    resultBadge.innerText = '손 없음';
                    resultBadge.className = "text-lg md:text-xl font-bold text-amber-500";
                }
            } catch (err) {
                console.error('Inference error:', err);
                debugBadge.classList.remove('hidden');
                debugText.innerText = `에러: ${err.message}`;
            }
        }

        toggleBtn.addEventListener('click', () => {
            isRunning = !isRunning;
            if (isRunning) {
                toggleBtn.innerText = '인식 중지';
                toggleBtn.className = 'flex-1 sm:flex-none px-5 py-2.5 bg-rose-600 hover:bg-rose-500 font-semibold text-sm text-white rounded-xl shadow-md transition-all duration-200 active:scale-95';
                inferenceInterval = setInterval(runInference, 700); // Poll every 700ms
            } else {
                toggleBtn.innerText = '인식 시작';
                toggleBtn.className = 'flex-1 sm:flex-none px-5 py-2.5 bg-emerald-600 hover:bg-emerald-500 font-semibold text-sm text-white rounded-xl shadow-md transition-all duration-200 active:scale-95';
                clearInterval(inferenceInterval);
                resultBadge.innerText = '대기 중...';
                resultBadge.className = "text-lg md:text-xl font-bold text-emerald-600";
                debugBadge.classList.add('hidden');
            }
        });

        window.addEventListener('load', initCamera);
    </script>
</body>
</html>
